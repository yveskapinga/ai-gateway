name: aigateway

services:
  postgres:
    image: postgres:16-alpine
    container_name: aigateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aigateway}
      POSTGRES_USER: ${POSTGRES_USER:-aigateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aigateway_dev_change_me}
    ports:
      - "${POSTGRES_PORT:-55441}:5432"
    volumes:
      - aigateway_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aigateway} -d ${POSTGRES_DB:-aigateway}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: aigateway-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - aigateway_ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  aigateway_pg_data:
  aigateway_ollama:
