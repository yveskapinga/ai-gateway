name: aigateway

services:
  postgres:
    image: postgres:16-alpine
    container_name: aigateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aigateway}
      POSTGRES_USER: ${POSTGRES_USER:-aigateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aigateway_dev_change_me}
    ports:
      - "${POSTGRES_PORT:-55441}:5432"
    volumes:
      - aigateway_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aigateway} -d ${POSTGRES_DB:-aigateway}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aigateway_pg_data:
